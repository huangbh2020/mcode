<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Same theme-token approach as desktop: FOUL-prevention script picks the
         saved/system theme before first paint to avoid a flash of the wrong
         scheme. Mobile defaults to the system preference; no PC-side theme
         sync in Phase 4. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mcode-mobile-theme");
          var dark =
            saved === "dark" ||
            ((!saved || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <title>Mcode</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
