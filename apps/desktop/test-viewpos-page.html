<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font: 24px sans-serif; }
    .marker { position: fixed; width: 300px; height: 100px; line-height: 100px; text-align: center; }
    #tl { left: 0; top: 0; background: red; }
    #tr { right: 0; top: 0; background: green; }
    #bl { left: 0; bottom: 0; background: blue; }
    #br { right: 0; bottom: 0; background: yellow; }
  </style>
</head>
<body>
  <div id="tl" class="marker">TOP-LEFT</div>
  <div id="tr" class="marker">TOP-RIGHT</div>
  <div id="bl" class="marker">BOTTOM-LEFT</div>
  <div id="br" class="marker">BOTTOM-RIGHT</div>
</body>
</html>
