<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>封面 1 · 没团队 我一个人做的</title>
<link rel="stylesheet" href="base.css">
<style>
  /* ── 封面 1(P1 首图)────────────────────────────────────────────
     规格来自计划书第五节:画布 1080×1440;大字在上 1/3(≤9 字);
     截图在下 2/3;一个手绘箭头指向截图。
     构图:大字 → 截图做成「贴纸」微微歪着压在纸面上(手账语汇),
     底部一行手写批注补掉空白。 */
  body { height: 1440px; position: relative; }

  /* ── 上 1/3:大字区 ───────────────────────────────────────────── */
  .head {
    position: absolute;
    top: 0; left: 0; width: 1080px;
    height: 486px;
    padding: 0 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .big {
    margin: 0;
    font-size: 130px;
    line-height: 1.3;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .big .l2 { margin-left: 104px; }
  /* 荧光笔:整段扫过(黄条压在字底下 62%–94% 处,模拟马克笔) */
  .mark {
    background-image: linear-gradient(to bottom,
      transparent 64%, rgb(var(--hl) / 0.52) 64%,
      rgb(var(--hl) / 0.52) 97%, transparent 97%);
    padding: 0 4px 2px 2px;
  }
  .sub-line {
    margin: 26px 0 0 6px;
    font-size: 33px;
    line-height: 1.5;
    color: rgb(var(--content-muted));
    letter-spacing: 1px;
  }
  .sub-line .dot { color: rgb(var(--accent)); font-weight: 700; }

  /* ── 下 2/3:截图贴纸 ─────────────────────────────────────────── */
  /* 截图原图 1440×900,按 1240px 宽显示 → 高 775px。左右各溢出 80px,
     让画面「大过画布」,比留白更像真实截图。 */
  .sticker {
    position: absolute;
    left: -80px;
    top: 500px;
    width: 1240px;
    transform: rotate(-1.15deg);
    background: rgb(var(--surface));
    border: 2px solid rgb(var(--edge));
    border-radius: var(--sk-r-lg);
    box-shadow: 8px 10px 0 rgb(var(--content) / 0.10);
    overflow: hidden;
    z-index: 2;
  }
  .sticker img { display: block; width: 1240px; }

  /* ── 底部批注:手写箭头 + 一行字 ─────────────────────────────── */
  .note {
    position: absolute;
    left: 0; width: 1080px;
    top: 1316px;
    z-index: 5;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 18px;
  }
  .note svg { flex: none; margin-top: -4px; }
  .note p {
    margin: 0;
    font-size: 37px;
    line-height: 1.2;
    letter-spacing: 1.5px;
    color: rgb(var(--content));
  }
  .note .acc { font-weight: 700; }

  /* ── 署名 ────────────────────────────────────────────────────── */
  .sign {
    position: absolute;
    left: 0; width: 1080px;
    top: 1396px;
    z-index: 5;
    text-align: center;
    font-size: 27px;
    letter-spacing: 2px;
    color: rgb(var(--content-subtle));
  }
</style>
</head>
<body>

  <div class="head">
    <h1 class="big">
      <div>没团队</div>
      <div class="l2"><span class="mark">我一个人做的</span></div>
    </h1>
    <div class="sub-line">
      <span class="dot">●</span>&nbsp;写代码的 · 一个人用 AI 从 0 做到上线
    </div>
  </div>

  <div class="sticker">
    <img src="img/home.png" alt="">
  </div>

  <div class="note">
    <!-- 手绘上指箭头:铅笔双描,笔尖指向截图 -->
    <svg width="46" height="62" viewBox="0 0 46 62">
      <g fill="none" stroke="rgb(8 140 105)" stroke-width="5"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M 23 58 C 21 42, 20 26, 22 10"/>
        <path d="M 8 26 C 13 20, 18 15, 22 9 C 27 15, 32 20, 37 25"/>
      </g>
    </svg>
    <p>我把它做成了<span class="acc">手账</span>的样子</p>
  </div>

  <div class="sign">黄同学｜一个人用 AI 做软件</div>
  <div class="grain"></div>
</body>
</html>
