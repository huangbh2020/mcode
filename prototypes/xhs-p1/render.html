<!doctype html>
<html lang="zh-CN" data-mode="sketch">
<head>
<meta charset="utf-8">
<title>小红书 P1 配图渲染</title>
<!-- 复用 app 内捆绑的霞鹜文楷,与手绘风主题用同一套字体 -->
<link rel="stylesheet" href="file:///Users/maiwy/workspace/cc-gui/apps/desktop/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css">
<link rel="stylesheet" href="file:///Users/maiwy/workspace/cc-gui/apps/desktop/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css">
<link rel="stylesheet" href="sketch.css">
<style>
/* ── 画布:每张图严格 1080×1440(小红书 3:4) ── */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden}
body{background:rgb(var(--surface));font-size:15px}
.shot{position:relative;width:1080px;height:1440px;overflow:hidden;background:rgb(var(--surface))}

/* 大字 */
.big{font-weight:700;letter-spacing:.01em;line-height:1.28}
.mk{background:linear-gradient(transparent 60%,rgb(var(--accent)/.30) 60%)}
.mk-w{background:linear-gradient(transparent 60%,rgb(var(--warning)/.28) 60%)}
.sub{color:rgb(var(--content-muted));line-height:1.7}

/* 贴纸(倾斜的窗口截图) */
.sticker{position:relative;background:rgb(var(--surface));border:1.5px solid rgb(var(--edge));
  border-radius:var(--sk-r-lg);box-shadow:7px 9px 0 rgb(var(--content)/.13);overflow:hidden}
.scaler{transform-origin:top left}

/* 手写批注 */
.hnote{color:rgb(var(--content-muted));line-height:1.5}
.arrow{stroke:rgb(var(--content-subtle));stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* 细节特写卡 */
.fcard{background:rgb(var(--surface));border:1.5px solid rgb(var(--edge));border-radius:var(--sk-r-lg);
  box-shadow:4px 5px 0 rgb(var(--content)/.10);padding:18px 20px}
.fcap{font-size:19px;color:rgb(var(--content-muted));margin-top:12px;text-align:center}

/* 流程清单 */
.step{display:flex;gap:20px;align-items:flex-start}
.snum{flex:none;width:70px;height:70px;border:2px solid rgb(var(--accent));border-radius:var(--sk-r-blob);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;
  color:rgb(var(--accent-strong));background:rgb(var(--accent)/.08)}
.stitle{font-weight:700;font-size:31px;line-height:1.35}
.sdesc{font-size:20px;color:rgb(var(--content-muted));line-height:1.6;margin-top:6px}
.rule{height:0;border-top:1.5px dashed rgb(var(--edge))}

/* 左栏快捷按钮:窄栏下不许折行 */
.lq .btn{white-space:nowrap}
/* app 窗口画高一点:3:4 竖版里要么铺满、要么自然出血裁切 */
.cover .cols{min-height:950px}
.bleed .cols{min-height:1120px}
</style>
</head>
<body class="sketch-scope">

<!-- 全局图标抖动滤镜(与 app 内 index.html 挂的是同一个) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="sk-wobble" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.019 0.032" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="root"></div>

<script>
/* ── Tabler 风格图标字典(取自设计稿,24×24 stroke) ── */
const ICONS = {
  minus:'<path d="M5 12h14"/>',
  square:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  check:'<path d="M4 12.5l5 5L20 6.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  'chev-d':'<path d="M6 9l6 6 6-6"/>',
  'chev-r':'<path d="M9 6l6 6-6 6"/>',
  terminal:'<path d="M4 17l6-5-6-5M12 19h8"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  branch:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-4 4.5-8 5"/>',
  message:'<path d="M8 10h8M8 14h5M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  bookmark:'<path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
  shield:'<path d="M12 3l7 3v5c0 4.6-3 7.6-7 9-4-1.4-7-4.4-7-9V6z"/>',
  undo:'<path d="M4 10h11a5 5 0 0 1 0 10h-3"/><path d="M8 6l-4 4 4 4"/>',
  zap:'<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
  pen:'<path d="M17 3l4 4L8 20l-5 1 1-5z"/>',
};
const ic = (n, s = 15) =>
  `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

/* ── app 窗口标记(与设计稿「应用全景」同构:左栏会话流 · 中栏聊天 · 活动轨 · 右栏 IDE) ── */
function appWindow(){
  const sess = (color, init, name, status, title, meta) => `
    <div class="card scard${status.sel ? ' sel' : ''}">
      <div class="r1"><span class="avatar" style="background:${color}">${init}</span>
        <span class="pname">${name}</span><span class="spill ${status.cls}">${status.text}</span></div>
      <div class="r2">${title}</div>
      <div class="r3">${meta}</div>
    </div>`;
  return `
  <div class="frame">
    <div class="titlebar">
      <div class="dot3"><i></i><i></i><i></i></div>
      <span class="tbrand">Mcode</span>
      <span class="tchip">手绘 · 纸面</span>
      <div class="winbtns">${ic('minus',13)}${ic('square',11)}${ic('x',13)}</div>
    </div>
    <div class="tabsbar">
      <div class="tab active">${ic('message',13)}手绘风主题<span class="x">${ic('x',11)}</span></div>
      <div class="tab">${ic('message',13)}插件系统 v1<span class="x">${ic('x',11)}</span></div>
      <div class="tab">${ic('file',13)}styles.css<span class="x">${ic('x',11)}</span></div>
      <div class="tab" style="padding:5px 8px">${ic('plus',13)}</div>
    </div>
    <div class="cols">
      <div class="lbar">
        <div class="lq">
          <button class="btn sm">${ic('plus',12)}新建</button>
          <button class="btn sm">${ic('search',12)}搜索</button>
          <button class="btn sm">${ic('terminal',12)}终端</button>
        </div>
        <div class="lscope"><span class="chip">${ic('chev-d',11)}全部项目</span></div>
        ${sess('rgb(8 140 105)','M','my-claude-gui',{cls:'run',text:'02:14',sel:true},'手绘风主题:字体与滤镜验证',`${ic('branch',11)}<span class="mono">feature/sketch</span>·<span class="pdot" style="background:rgb(8 140 105)"></span>`)}
        ${sess('rgb(112 78 196)','P','pi-sdk-integration',{cls:'wait',text:'待输入'},'计划模式审批链路复现',`${ic('branch',11)}<span class="mono">main</span>·<span class="pdot" style="background:rgb(112 78 196)"></span>`)}
        ${sess('rgb(173 108 16)','C','codex-app-server',{cls:'done',text:'✓'},'子代理 roster 回填 toolUseId',`${ic('branch',11)}<span class="mono">main</span>·<span class="pdot" style="background:rgb(173 108 16)"></span>`)}
        ${sess('rgb(2 132 199)','W','web-dash',{cls:'',text:''},'LSP 面板改单行布局','3 小时前')}
        ${sess('rgb(199 62 52)','D','docs-site',{cls:'',text:''},'补一份主题扩展文档','昨天')}
        ${sess('rgb(112 78 196)','S','settings-panel',{cls:'done',text:'✓'},'字体选择器加卸载检测','昨天')}
        ${sess('rgb(8 140 105)','M','my-claude-gui',{cls:'',text:''},'活动台时间轴改真实起止','2 天前')}
        ${sess('rgb(173 108 16)','P','plugin-registry',{cls:'',text:''},'插件加载顺序排查','3 天前')}
        <div class="chip" style="margin-top:4px">${ic('chev-r',11)}归档 · 12</div>
      </div>

      <div class="chat">
        <div class="stream">
          <div class="msg-user">把手绘风的圆角改成不规则的那套,顺便给图标加上抖动滤镜。</div>
          <div class="msg-ai">
            <p>好的。形状配方放在 <span class="inline-code">--sk-r-*</span> 三档里,相邻角刻意做成 225px / 18px 的悬殊比例,浏览器按比例收缩后就是有机的手抖边缘:</p>
            <ul>
              <li>大圆角给卡片和面板,中号给按钮和气泡,小号给 chip;</li>
              <li>图标抖动只挂 <span class="inline-code">svg</span>,绝不挂根节点——整树重栅格化扛不住;</li>
              <li>上下文环保持正圆,它是仪表不是笔迹。</li>
            </ul>
          </div>
          <div class="card dashed tcard">
            <div class="th">${ic('spark',14)}思考<span class="t-meta">6.4s · 已折叠</span></div>
          </div>
          <div class="card tcard">
            <div class="th">${ic('terminal',14)}Bash<span class="t-meta">1.2s · ✓</span></div>
            <div class="tbody"><div class="mono">pnpm typecheck</div>
              <div class="mono" style="color:rgb(var(--success))">✓ 0 errors in 14 files</div></div>
          </div>
          <div class="card tcard">
            <div class="th">${ic('pen',14)}本轮修改 · 3 个文件<span class="t-meta"><button class="btn ghost sm">撤销本轮</button></span></div>
            <div class="filechips">
              <span class="fchip">styles.css <b class="tally-add">+118</b><b class="tally-del">−12</b></span>
              <span class="fchip">theme.ts <b class="tally-add">+34</b><b class="tally-del">−6</b></span>
              <span class="fchip">index.html <b class="tally-add">+9</b><b class="tally-del">−2</b></span>
            </div>
          </div>
          <div class="card tcard retrace">
            <div class="th"><span class="idx">1</span>手绘主题落地<span class="badge-new">最新</span></div>
            <div class="tbody">字体子集化 → 管道打通 → 图标滤镜限域 → 硬阴影与纸纹打磨。</div>
          </div>
          <div class="msg-user">终端的虚线内衬也一起做了吧,顺便把字号顶到 15。</div>
          <div class="msg-ai">
            <p>内衬框挂在终端宿主上,底部和右侧终端共用同一个挂载点,所以只写一处:</p>
            <ul>
              <li>宿主改绝对定位 + 内缩 6/8px,压过组件的 <span class="inline-code">h-full</span>;</li>
              <li>字号只在用户没显式改过时生效——等于默认值就移除 inline,让样式表顶上去。</li>
            </ul>
          </div>
          <div class="card tcard">
            <div class="th">${ic('terminal',14)}Bash<span class="t-meta">3.8s · ✓</span></div>
            <div class="tbody"><div class="mono">pnpm test:theme</div>
              <div class="mono" style="color:rgb(var(--success))">✓ 12 passed (12)</div></div>
          </div>
        </div>
        <div class="card composer retrace">
          <textarea class="ta" rows="1" placeholder="回复 Mcode…"></textarea>
          <div class="pillbar">
            <span class="pillseg">${ic('plus',12)}附件</span>
            <span class="pillseg">${ic('spark',12)}GLM-4.7</span>
            <span class="pillseg">${ic('zap',12)}思考 · 高</span>
            <span class="pillseg">${ic('shield',12)}计划</span>
            <span class="ring"><i>38</i></span>
            <button class="send">${ic('send',15)}</button>
          </div>
        </div>
      </div>

      <div class="rail">
        <div class="rnode">${ic('file',12)}</div>
        <div class="rnode run">${ic('message',12)}</div>
        <div class="rnode">${ic('check',12)}</div>
        <div class="rnode">${ic('bookmark',12)}</div>
      </div>

      <div class="rpanel">
        <div class="rtabs"><span class="rtab on">文件</span><span class="rtab">Git</span><span class="rtab">终端</span></div>
        <div class="tree">
          <div class="trow dir">${ic('chev-d',11)}${ic('folder',13)}renderer</div>
          <div class="trow dir i1">${ic('chev-d',11)}${ic('folder',13)}components</div>
          <div class="trow i1">${ic('file',13)}FileEditor.tsx</div>
          <div class="trow i1 sel">${ic('file',13)}styles.css</div>
          <div class="trow dir i1">${ic('chev-d',11)}${ic('folder',13)}settings</div>
          <div class="trow i1">${ic('file',13)}AppearancePanel.tsx</div>
          <div class="trow i1">${ic('file',13)}FontPickerDialog.tsx</div>
          <div class="trow dir i1">${ic('chev-r',11)}${ic('folder',13)}lib</div>
          <div class="trow i1">${ic('file',13)}theme.ts</div>
          <div class="trow i1">${ic('file',13)}icons.tsx</div>
          <div class="trow dir">${ic('chev-r',11)}${ic('folder',13)}main</div>
          <div class="trow dir">${ic('chev-r',11)}${ic('folder',13)}packages</div>
        </div>
        <div class="rtabs"><span class="rtab on">Git</span><span class="rtab">文件</span><span class="rtab">终端</span></div>
        <div>
          <div class="gitrow"><span class="chip">${ic('branch',10)}feature/sketch ↑2</span></div>
          <div class="gitrow">${ic('pen',11)}<span class="fn">styles.css</span><b class="tally-add">+118</b><b class="tally-del">−12</b></div>
          <div class="gitrow">${ic('pen',11)}<span class="fn">theme.ts</span><b class="tally-add">+34</b><b class="tally-del">−6</b></div>
          <div class="gitrow">${ic('pen',11)}<span class="fn">index.html</span><b class="tally-add">+9</b><b class="tally-del">−2</b></div>
          <div class="gitrow">${ic('plus',11)}<span class="fn">FontPickerDialog.tsx</span><b class="tally-add">+186</b></div>
          <div class="gitrow">${ic('file',11)}<span class="fn">AppearancePanel.tsx</span><b class="tally-add">+22</b><b class="tally-del">−4</b></div>
          <div class="gitrow"><button class="btn sm" style="margin-top:4px">${ic('check',12)}提交</button></div>
        </div>
        <div class="card dashed term">
          <div><span class="pr">$</span> pnpm dev</div><div>ready in 812ms</div>
          <div><span class="pr">$</span> <span style="opacity:.5">▌</span></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── 工具审批卡(中栏特写用) ── */
function approvalCard(){
  return `
  <div class="card appr">
    <div class="ttl">${ic('shield',15)}要修改文件
      <span class="spill wait" style="margin-left:auto"><i></i>等待确认</span></div>
    <div class="desc">模型请求在项目内修改以下文件:</div>
    <div class="path mono">src/renderer/styles.css   +118 −12</div>
    <div class="path mono">src/renderer/lib/theme.ts  +34 −6</div>
    <div class="acts">
      <button class="btn primary sm">允许</button>
      <button class="btn sm">总是允许</button>
      <button class="btn danger sm">拒绝</button>
    </div>
  </div>`;
}

/* ═══ 图 1:封面(大字 + 倾斜窗口贴纸) ═══ */
function shotCover(){
  return `
  <div class="shot cover" style="padding:60px 0 0">
    <div style="padding:0 76px">
      <div class="big" style="font-size:94px">
        写代码的软件<br>被我做成了<span class="mk">手账</span>
      </div>
      <div class="sub" style="font-size:26px;margin-top:24px">
        一个人用 AI 做的 · 连图标都是手抖的
      </div>
      <div class="hnote" style="font-size:23px;margin-top:10px">
        （它是真的能用的 IDE，不是换皮肤）
      </div>
    </div>

    <div style="position:absolute;left:24px;top:436px;width:1032px">
      <div class="sticker" style="transform:rotate(-1deg)">
        <div class="scaler" style="width:1166px;transform:scale(.885)">
          ${appWindow()}
        </div>
      </div>
    </div>
  </div>`;
}

/* 整屏形态:窗口满幅出血,底部自然裁切(像真截图) */
function pumpedWindow(title, sub){
  return `
  <div class="shot bleed" style="padding:0">
    <div style="position:absolute;left:0;top:0;width:1080px;padding:44px 54px 0">
      <div class="big" style="font-size:44px">${title}</div>
      <div class="sub" style="font-size:22px;margin-top:8px">${sub}</div>
    </div>
    <div style="position:absolute;left:-18px;top:190px;width:1116px">
      <div class="sticker" style="transform:rotate(-.5deg)">
        <div class="scaler" style="width:1166px;transform:scale(.957)">
          ${appWindow()}
        </div>
      </div>
    </div>
  </div>`;
}

/* ═══ 图 2:整屏(纸面) ═══ */
const shotFull = () => pumpedWindow("手绘 · 纸面", "暖纸底 + 墨线 + 手写字体");

/* ═══ 图 3:牛皮纸(深色形态) ═══ */
const shotKraft = () => pumpedWindow("深色 · 牛皮纸", "同一个主题的夜间形态");

/* ═══ 图 4:细节特写(四行,卡片放大到看得清) ═══ */
function shotDetail(){
  const scard = (color, init, name, spill, title, meta, sel) => `
    <div class="card scard${sel ? ' sel' : ''}" style="margin:0;width:270px">
      <div class="r1"><span class="avatar" style="background:${color}">${init}</span>
        <span class="pname">${name}</span><span class="spill ${spill[0]}">${spill[1]}</span></div>
      <div class="r2">${title}</div>
      <div class="r3">${meta}</div>
    </div>`;

  // zoom(而非 transform)让卡片高度跟随缩放后的内容自适应,不会被裁切
  const row = (num, cap, inner, w, zoom) => `
    <div style="margin-bottom:20px">
      <div class="fcard" style="padding:24px 30px">
        <div style="width:${w}px;zoom:${zoom}">${inner}</div>
      </div>
      <div class="fcap" style="text-align:left;font-size:21px;margin-top:10px">${num} ${cap}</div>
    </div>`;

  return `
  <div class="shot" style="padding:46px 48px">
    <div class="big" style="font-size:46px;margin-bottom:6px">手绘风，藏在细节里</div>
    <div class="sub" style="font-size:22px;margin-bottom:30px">挑五个地方放大给你看</div>

    ${row('①', '输入框是一颗迷你药丸：附件 · 模型 · 思考级 · 权限 · 上下文环', `
      <div class="pillbar" style="margin:0;flex-wrap:nowrap">
        <span class="pillseg">${ic('plus',15)}附件</span>
        <span class="pillseg">${ic('spark',15)}GLM-4.7</span>
        <span class="pillseg">${ic('zap',15)}思考 · 高</span>
        <span class="pillseg">${ic('shield',15)}计划</span>
        <span class="ring" style="width:28px;height:28px"><i style="width:22px;height:22px;font-size:11px">38</i></span>
        <button class="send" style="width:42px;height:42px">${ic('send',20)}</button>
      </div>`, 548, 1.68)}

    ${row('②', '每次动手都要先过你这一关，不做「静默的自动执行」', approvalCard(), 620, 1.48)}

    ${row('③', '改完看得见，坏了退得回——撤销本轮把文件一起还原', `
      <div class="card tcard" style="margin:0">
        <div class="th">${ic('pen',15)}本轮修改 · 3 个文件
          <span class="t-meta"><button class="btn ghost sm">撤销本轮</button></span></div>
        <div class="filechips">
          <span class="fchip">styles.css <b class="tally-add">+118</b><b class="tally-del">−12</b></span>
          <span class="fchip">theme.ts <b class="tally-add">+34</b><b class="tally-del">−6</b></span>
          <span class="fchip">index.html <b class="tally-add">+9</b><b class="tally-del">−2</b></span>
        </div>
      </div>`, 700, 1.31)}

/* ═══ 图 5:7 步工作流清单(收藏钩子) ═══ */
function shotWorkflow(){
  const steps = [
    ['先说清要什么', '把想法写成一页需求丢给它。别边聊边改，越改越散。'],
    ['先让它出方案', '计划模式下它只看不动，方案不对当场推翻，零成本。'],
    ['一次只推进一件事', '小步走，每一步结束都能跑起来，出问题好定位。'],
    ['每个改动都过你的眼', '逐个审批 + 并排 diff。不看就点允许，等于没设防。'],
    ['坏了就退回去', '一键撤销这一轮。别在错的基础上硬改，会越陷越深。'],
    ['让它自己验', '类型检查 / 构建 / 测试交给它跑，你只看结论。'],
    ['攒下项目约定', '把规则写进项目说明。下次开新会话，不用重新教一遍。'],
  ];
  return `
  <div class="shot" style="padding:58px 64px">
    <div class="big" style="font-size:54px">一个人用 AI 做软件</div>
    <div class="big" style="font-size:54px;margin-top:2px">我的 <span class="mk">7 步</span>工作流</div>
    <div class="sub" style="font-size:22px;margin-top:16px">照着走一遍，能少踩很多坑</div>
    <div class="rule" style="margin:32px 0 34px"></div>
    ${steps.map(([t, d], i) => `
      <div class="step" style="margin-bottom:${i === steps.length - 1 ? 0 : 54}px">
        <div class="snum">${i + 1}</div>
        <div style="padding-top:4px">
          <div class="stitle">${t}</div>
          <div class="sdesc">${d}</div>
        </div>
      </div>`).join('')}
    <div class="rule" style="margin:34px 0 24px"></div>
    <div class="hnote" style="font-size:23px;text-align:center">
      工具是笔，不是作者。<span class="mk-w">决定权始终在人手上。</span>
    </div>
    <div style="font-size:21px;text-align:center;margin-top:20px;color:rgb(var(--content-subtle))">
      —— 先收藏，开工前翻出来对一遍
    </div>
  </div>`;
}

/* ── 路由 ── */
const SHOTS = { cover: shotCover, full: shotFull, kraft: shotKraft, detail: shotDetail, workflow: shotWorkflow };

document.documentElement.dataset.mode = name === 'kraft' ? 'kraft' : 'sketch';
document.getElementById('root').innerHTML = (SHOTS[name] || shotCover)();
</script>
